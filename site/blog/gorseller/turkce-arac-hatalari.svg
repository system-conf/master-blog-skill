<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" height="396" role="img"
     aria-label="Dört Türkçe ölçüm hatası: İ küçültmesi araya görünmez nokta ekliyor, şapkalı harf ayrı kelime sayılıyor, ünsüz yumuşaması kök eşleşmesini bozuyor, kelime içi tireler sayımı şişiriyor.">
  <style>
    .bg{fill:#0B0B0B}
    .b{font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:700;fill:#FFFFFF}
    .t{font-family:Manrope,Helvetica,Arial,sans-serif;fill:#A8A29E}
    .m{font-family:Menlo,monospace;fill:#C9C5C2}
    .lbl{font-family:Menlo,monospace;fill:#8A837D}
    .kotu{fill:#F87171} .or{fill:#FF9A4D}
    .satir{fill:#151515;stroke:#242424}
    .ok{stroke:#3A3A3A;stroke-width:2;fill:none}
  </style>
  <rect class="bg" width="900" height="396"/>
  <text class="lbl" x="36" y="30" font-size="11" letter-spacing="1.6">GİRDİ</text>
  <text class="lbl" x="330" y="30" font-size="11" letter-spacing="1.6">ARAÇ NE YAPIYOR</text>
  <text class="lbl" x="672" y="30" font-size="11" letter-spacing="1.6">SONUÇ</text>

  <!-- 1 -->
  <rect class="satir" x="30" y="44" width="840" height="74" rx="9"/>
  <text class="m" x="48" y="76" font-size="14">"İçerik pazarlaması"</text>
  <text class="t" x="48" y="99" font-size="11.5">hedef kelime: içerik</text>
  <path class="ok" d="M270 80 L318 80"/>
  <text class="m" x="330" y="72" font-size="13">.lower() → i + U+0307</text>
  <text class="t" x="330" y="95" font-size="11.5">araya görünmez birleşen nokta giriyor</text>
  <path class="ok" d="M622 80 L664 80"/>
  <text class="kotu" x="676" y="76" font-size="13" font-family="Archivo,Helvetica,sans-serif" font-weight="700">bulunamadı</text>
  <text class="t" x="676" y="99" font-size="11.5">madde 14 ve 18 yanlış</text>

  <!-- 2 -->
  <rect class="satir" x="30" y="128" width="840" height="74" rx="9"/>
  <text class="m" x="48" y="160" font-size="14">"yapay zekâ"</text>
  <text class="t" x="48" y="183" font-size="11.5">hedef kelime: yapay zeka</text>
  <path class="ok" d="M270 164 L318 164"/>
  <text class="m" x="330" y="156" font-size="13">tam metin karşılaştırması</text>
  <text class="t" x="330" y="179" font-size="11.5">â ile a ayrı kod noktası</text>
  <path class="ok" d="M622 164 L664 164"/>
  <text class="kotu" x="676" y="160" font-size="13" font-family="Archivo,Helvetica,sans-serif" font-weight="700">iki ayrı kelime</text>
  <text class="t" x="676" y="183" font-size="11.5">başlıkta yok sanılıyor</text>

  <!-- 3 -->
  <rect class="satir" x="30" y="212" width="840" height="74" rx="9"/>
  <text class="m" x="48" y="244" font-size="14">"içeriği"</text>
  <text class="t" x="48" y="267" font-size="11.5">hedef kelime: içerik</text>
  <path class="ok" d="M270 248 L318 248"/>
  <text class="m" x="330" y="240" font-size="13">alt dize araması</text>
  <text class="t" x="330" y="263" font-size="11.5">ünsüz yumuşaması: k → ğ</text>
  <path class="ok" d="M622 248 L664 248"/>
  <text class="kotu" x="676" y="244" font-size="13" font-family="Archivo,Helvetica,sans-serif" font-weight="700">eşleşme yok</text>
  <text class="t" x="676" y="267" font-size="11.5">kök değişti, alt dize kalmadı</text>

  <!-- 4 -->
  <rect class="satir" x="30" y="296" width="840" height="74" rx="9"/>
  <text class="m" x="48" y="328" font-size="14">"E-ticaret · 10-15 gün"</text>
  <text class="t" x="48" y="351" font-size="11.5">gerçek: 9 kelime</text>
  <path class="ok" d="M270 332 L318 332"/>
  <text class="m" x="330" y="324" font-size="13">madde imi diye tire siliniyor</text>
  <text class="t" x="330" y="347" font-size="11.5">kelime içi tire de gidiyor</text>
  <path class="ok" d="M622 332 L664 332"/>
  <text class="or" x="676" y="328" font-size="13" font-family="Archivo,Helvetica,sans-serif" font-weight="700">12 kelime · %33 şişme</text>
  <text class="t" x="676" y="351" font-size="11.5">ince içerik eşiği erken açılıyor</text>
</svg>
