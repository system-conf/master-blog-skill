<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img"
     aria-label="Kanibalizasyonda sinyal bölünmesi: aynı sorguyu hedefleyen iki sayfa gücü ikiye böler, tek sayfa toplar.">
  <style>
    .bg{fill:#0B0B0B} .kart{fill:#151515;stroke:#242424} .kart-o{fill:#151515;stroke:#3A2A18}
    .b{font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:700;fill:#FFFFFF}
    .t{font-family:Manrope,Helvetica,Arial,sans-serif;fill:#A8A29E}
    .m{font-family:'JetBrains Mono',Menlo,monospace;fill:#8A837D}
    .or{fill:#FF6A00} .okr{stroke:#3A3A3A;stroke-width:2;fill:none} .oko{stroke:#FF6A00;stroke-width:2.5;fill:none}
    .kotu{fill:#F87171} .iyi{fill:#4ADE80}
  </style>
  <rect class="bg" width="900" height="360"/>
  <line x1="450" y1="26" x2="450" y2="334" stroke="#242424" stroke-dasharray="4 6"/>

  <!-- SOL: iki sayfa -->
  <text class="m" x="36" y="34" font-size="11" letter-spacing="1.6">İKİ SAYFA · AYNI NİYET</text>
  <rect class="kart" x="36" y="50" width="368" height="46" rx="9"/>
  <text class="t" x="52" y="79" font-size="14">Sorgu: <tspan class="b" font-size="14">oyun grubu fiyatları</tspan></text>
  <path class="okr" d="M140 96 L140 128 L110 128 L110 152"/>
  <path class="okr" d="M300 96 L300 128 L330 128 L330 152"/>

  <rect class="kart" x="36" y="152" width="176" height="96" rx="9"/>
  <text class="t" x="50" y="176" font-size="12.5">/fiyatlari</text>
  <text class="m" x="50" y="199" font-size="11">iç link · 4</text>
  <text class="m" x="50" y="217" font-size="11">backlink · 2</text>
  <text class="kotu" x="50" y="238" font-size="13" font-family="Archivo,Helvetica,sans-serif" font-weight="700">11. sıra</text>

  <rect class="kart" x="228" y="152" width="176" height="96" rx="9"/>
  <text class="t" x="242" y="176" font-size="12.5">/kac-para</text>
  <text class="m" x="242" y="199" font-size="11">iç link · 4</text>
  <text class="m" x="242" y="217" font-size="11">backlink · 2</text>
  <text class="kotu" x="242" y="238" font-size="13" font-family="Archivo,Helvetica,sans-serif" font-weight="700">14. sıra</text>

  <text class="t" x="36" y="286" font-size="13">Sinyal ikiye bölünür; hiçbiri eşiği aşamaz.</text>
  <text class="m" x="36" y="310" font-size="11">Google hangisini göstereceğine karar veremez.</text>

  <!-- SAĞ: tek sayfa -->
  <text class="m" x="496" y="34" font-size="11" letter-spacing="1.6" fill="#FF9A4D">BİRLEŞTİRİLMİŞ · 301</text>
  <rect class="kart-o" x="496" y="50" width="368" height="46" rx="9"/>
  <text class="t" x="512" y="79" font-size="14">Sorgu: <tspan class="b" font-size="14">oyun grubu fiyatları</tspan></text>
  <path class="oko" d="M680 96 L680 152"/>

  <rect class="kart-o" x="592" y="152" width="176" height="96" rx="9"/>
  <text class="t" x="606" y="176" font-size="12.5">/fiyatlari</text>
  <text class="m" x="606" y="199" font-size="11" fill="#FF9A4D">iç link · 8</text>
  <text class="m" x="606" y="217" font-size="11" fill="#FF9A4D">backlink · 4</text>
  <text class="iyi" x="606" y="238" font-size="13" font-family="Archivo,Helvetica,sans-serif" font-weight="700">4. sıra</text>

  <text class="t" x="496" y="286" font-size="13">Sinyal tek sayfada toplanır; eşiği aşar.</text>
  <text class="m" x="496" y="310" font-size="11">Zayıf URL kanoniğe 301 ile bağlanır.</text>
</svg>
