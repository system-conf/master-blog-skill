name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 */3 *"   # 3 ayda bir: kaynaklar.md tazeleme hatırlatması

jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # sitemap lastmod git geçmişinden hesaplanıyor
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Plugin ve eval tanımları geçerli JSON mu
        run: |
          python3 -c "import json;[json.load(open(f)) for f in ['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','skills/master-blog/evals/evals.json']];print('ok')"
          python3 -c "
          import json
          p=json.load(open('.claude-plugin/plugin.json'))
          s=open('skills/master-blog/SKILL.md').read()
          assert f'surum: \"{p[\"version\"]}\"' in s, 'plugin.json ve SKILL.md sürümleri uyuşmuyor'
          assert p['version'] in open('CHANGELOG.md').read(), 'CHANGELOG sürümü eksik'
          print('sürümler tutarlı:', p['version'])"

      - name: README dil geçişleri ve iç dosya bağlantıları
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          hata = []
          tr, en = pathlib.Path('README.md').read_text(), pathlib.Path('README.en.md').read_text()
          if '[English](README.en.md)' not in tr: hata.append('README.md içinde English geçişi yok')
          if '[Türkçe](README.md)' not in en:     hata.append('README.en.md içinde Türkçe geçişi yok')
          for ad, metin in (('README.md', tr), ('README.en.md', en)):
              for hedef in re.findall(r'\]\((?!https?:|#)([^)]+)\)', metin):
                  if not pathlib.Path(hedef.split('#')[0]).exists():
                      hata.append(f'{ad}: {hedef} dosyası yok')
          if hata:
              print('\n'.join('::error::' + h for h in hata)); sys.exit(1)
          print('README dosyaları tutarlı')
          PY

      - name: README'lerde ölü dizin referansı var mı
        run: |
          for f in README.md README.en.md CONTRIBUTING.md; do
            if grep -qE '(^|[^s])skill/master-blog' "$f"; then
              echo "::error::$f içinde eski 'skill/master-blog' yolu var (doğrusu: skills/)"; exit 1
            fi
          done
          echo "dizin referansları güncel"

      - name: İkonlar üretilebilir ve commit'lenenle aynı mı
        run: |
          python3 tools/favicon-uret.py
          git diff --exit-code -- site/assets \
            || { echo "::error::favicon üretimi commit'lenenle uyuşmuyor"; exit 1; }

      - name: surum.json plugin.json ile tutarlı mı
        run: |
          python3 -c "
          import json
          a=json.load(open('.claude-plugin/plugin.json')); b=json.load(open('docs/surum.json'))
          assert a['version']==b['surum'], f\"surum.json {b['surum']} != plugin.json {a['version']}\"
          assert b['bilgi_tazeligi'] and b['terim_sayisi']>0
          print('surum.json tutarli:', b['surum'], b['bilgi_tazeligi'])"

      - name: kur.sh paketle tutarlı mı
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          kur = pathlib.Path('docs/kur.sh').read_text()
          liste = re.search(r'DOSYALAR="(.*?)"', kur, re.S).group(1)
          dosyalar = [x.strip() for x in liste.replace('\\\n', ' ').split() if x.strip()]
          eksik = [d for d in dosyalar if not (pathlib.Path('docs/paket') / d).exists()]
          if eksik:
              print('\n'.join('::error::kur.sh %s istiyor ama docs/paket/ altında yok' % d for d in eksik))
              sys.exit(1)
          fazla = [str(p.relative_to('docs/paket')) for p in pathlib.Path('docs/paket').rglob('*')
                   if p.is_file() and str(p.relative_to('docs/paket')) not in dosyalar]
          if fazla:
              print('::error::docs/paket içinde kur.sh listesinde olmayan dosya: ' + ', '.join(fazla))
              sys.exit(1)
          print(f'kur.sh {len(dosyalar)} dosya istiyor, paket eksiksiz')
          PY

      - name: Regresyon testleri (kontrol.py)
        run: python3 tests/calistir.py

      - name: Mekanik kontrol temiz fixture üzerinde
        run: python3 skills/master-blog/scripts/kontrol.py tests/fixtures/temiz.md --kelime "güvenlik mesafesi"

      - name: Blog yazıları kendi denetçisinden geçiyor mu
        run: |
          for f in site/blog/*.md; do
            [ -e "$f" ] || continue
            echo "--- $f"
            python3 skills/master-blog/scripts/kontrol.py "$f" || exit 1
          done

      - name: Build (veri doğrulama + site üretimi)
        run: python3 build.py

      - name: Üretilen çıktı commit'lenenle aynı mı
        run: |
          git diff --exit-code -- docs dist skills/master-blog/references/terimler-sozlugu.md \
            || { echo "::error::build.py çıktısı commit'lenmiş dosyalarla uyuşmuyor. 'python3 build.py' çalıştırıp sonucu commit'le."; exit 1; }

  dis-linkler:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: kaynaklar.md içindeki dış bağlantılar hâlâ yaşıyor mu
        run: |
          fail=0
          for u in $(grep -o 'https://[^)]*' skills/master-blog/references/kaynaklar.md | sort -u); do
            code=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 20 -A "Mozilla/5.0" "$u" || echo 000)
            [ "$code" = "200" ] || { echo "::warning::$code $u"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "tüm kaynaklar 200" || echo "::warning::bazı kaynaklar yanıt vermedi — kaynaklar.md tazelenmeli"
